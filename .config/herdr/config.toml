# herdr configuration — see `herdr --default-config` for all options
# ~/.config/herdr/ also holds sockets/logs/session state; only this file is tracked.

[keys]
# Prefix-free layer on plain alt — same delivery path as the proven alt+1..9.
# Each action lists its ctrl+b default too, since overriding replaces defaults.
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
split_vertical = ["prefix+v", "alt+d"]
split_horizontal = ["prefix+minus", "alt+shift+d"]
new_tab = ["prefix+c", "alt+t"]
close_tab = ["prefix+shift+x", "alt+w"]
close_pane = ["prefix+x", "alt+x"]
zoom = ["prefix+z", "alt+z"]
previous_agent = "alt+p"
next_agent = "alt+n"
previous_tab = ["prefix+p", "alt+shift+p"]
next_tab = ["prefix+n", "alt+shift+n"]
previous_workspace = "alt+comma"
next_workspace = "alt+period"

[keys.indexed]
tabs = "ctrl"          # ctrl+1..9 switch tabs directly (no prefix)
agents = "alt"         # alt+1..9 focus agent rows directly
workspaces = "ctrl+shift"  # ctrl+shift+1..9 switch workspaces directly

# Plugin actions on direct keys
[[keys.command]]
key = "alt+f"    # note: Ghostty's alt+shift+right emits the same sequence (word jump) — accepted, unused
type = "shell"
command = "herdr plugin action invoke open-file-viewer"

[[keys.command]]
key = "alt+r"
type = "shell"
command = "herdr plugin action invoke toggle --plugin persiyanov.reviewr"

[[keys.command]]
key = "alt+m"
type = "shell"
command = "herdr plugin action invoke toggle --plugin nicosuave.memex"

[[keys.command]]
key = "alt+o"
type = "pane"
command = "herdr-open-web"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#89b4fa", bold = true }],
  [{ token = "branch", fg = "#a6e3a1" }, { token = "git_status", fg = "#f9e2af" }],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "state_text", bold = true },
    { token = "workspace", fg = "#89b4fa", bold = true },
    { token = "tab", fg = "#cba6f7" },
  ],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.sound]
enabled = false

[experimental]
# Browser plugin renders pages as images; needs kitty graphics (Ghostty supports it)
kitty_graphics = true
