# herdr configuration — see `herdr --default-config` for all options
# ~/.config/herdr/ also holds sockets/logs/session state; only this file is tracked.

[keys]
# Direct terminal-mode chords — ctrl+alt+letter is unused by shells, vim, and
# the agents, and only DELETE/TAB are taken at the Hyprland level.
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"
split_vertical = "ctrl+alt+v"
split_horizontal = "ctrl+alt+s"
new_tab = "ctrl+alt+t"
close_tab = "ctrl+alt+w"
close_pane = "ctrl+alt+x"
zoom = "ctrl+alt+z"

[keys.indexed]
tabs = "ctrl"    # ctrl+1..9 switch tabs directly (no prefix)
agents = "alt"   # alt+1..9 focus agent rows directly

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
