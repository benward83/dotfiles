# herdr configuration — see `herdr --default-config` for all options
# ~/.config/herdr/ also holds sockets/logs/session state; only this file is tracked.

[keys]
# Prefix-free layer on plain alt — same delivery path as the proven alt+1..9.
# Each action lists its ctrl+b default too, since overriding replaces defaults.
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
split_vertical = ["prefix+v", "alt+d"]
split_horizontal = ["prefix+minus", "alt+shift+d"]
new_tab = ["prefix+c", "alt+t"]
close_tab = ["prefix+shift+x", "alt+w"]
close_pane = ["prefix+x", "alt+x"]
zoom = ["prefix+z", "alt+z"]

[keys.indexed]
tabs = "ctrl"    # ctrl+1..9 switch tabs directly (no prefix)
agents = "alt"   # alt+1..9 focus agent rows directly

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
