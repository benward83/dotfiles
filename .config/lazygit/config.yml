gui:
  showFileTree: false

services:
  "gitlab.q8s.dev": "gitlab:gitlab.q8s.dev"

keybinding:
  branches:
    createPullRequest: <disabled>

customCommands:
  - key: "o"
    context: "localBranches"
    description: "GitLab: create MR for selected branch"
    command: "git push -u origin {{.SelectedLocalBranch.Name}} -o merge_request.create"
    loadingText: "Creating merge request..."
  - key: "<c-r>"
    context: "global"
    description: "Coverseal: full DB reset (down, wipe, up, migrate, base, gen types)"
    command: "coverseal-db-reset"
    output: terminal
  - key: "<c-x>"
    context: "global"
    description: "DB: migrate dev after switching branches"
    command: "just db::migrate-dev"
    output: terminal
